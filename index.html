<title>Trainer Prozentrechnung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Levelspiel in der Shopping-Mall am Abend. Startseite = Level-Pfad, Spielfeld = weiße Aufgabenkarte, Sterne fliegen zum Zähler oben */
:root{
  color-scheme:dark;
  --nacht1:#2b1745; --nacht2:#3d1d56; --nacht3:#4a2152;
  --text:#ffffff; --leise:#e2c6ee; --glas:rgba(255,255,255,.08); --glasrand:rgba(255,255,255,.2);
  --gold:#ffd54a; --goldd:#f29a00; --gruen:#00a97e; --gruend:#00694e;
  --karte:#ffffff; --tinte:#111111; --ok:#1b7a3e; --okbg:#e3f5e9; --err:#b3261e; --errbg:#fdecea;
  --font:Arial,"Liberation Sans",Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--nacht1)}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--font);font-size:18px;line-height:1.45;
  background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/34px 34px,radial-gradient(700px 380px at 90% -5%,rgba(255,120,190,.40) 0%,transparent 60%),radial-gradient(600px 360px at 5% 105%,rgba(80,200,220,.22) 0%,transparent 60%),linear-gradient(180deg,var(--nacht1) 0%,var(--nacht2) 55%,var(--nacht3) 100%);background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
#himmel{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.schule{font-size:.75rem;letter-spacing:.14em;color:var(--leise)}
h1{margin:2px 0 0;font-size:clamp(1.7rem,4.5vw,2.5rem);line-height:1.1}
h1 span{color:var(--gold)}
.zaehler{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 16px;font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums;transition:transform .25s}
.zaehler svg{width:28px;height:28px}
.zaehlwerk{display:flex;gap:10px;flex-wrap:wrap}
.bonus{display:inline-flex;align-items:center;gap:3px;font-size:.85rem;font-weight:700;color:#1b2559;background:#ffe98a;border-radius:999px;padding:2px 9px}
.topf{display:flex;align-items:center;gap:6px;justify-content:center;color:#1b2559;font-size:.95rem}
.topf i{width:16px;height:16px;border-radius:50%;border:2px solid #f2a900;display:inline-block}
.topf i.voll{background:#ffd23f}
.topf svg{width:30px;height:30px}
.mflug{position:fixed;left:50%;top:45%;width:200px;height:200px;margin:-100px 0 0 -100px;z-index:50;pointer-events:none;perspective:600px}
.mflug svg{width:100%;height:100%;filter:drop-shadow(0 0 22px rgba(255,213,74,.9))}
.zaehler.puls{transform:scale(1.25);box-shadow:0 0 30px rgba(255,213,74,.7)}
.sub{color:#f1e2f6;margin:0}
#app{display:flex;flex-direction:column;gap:18px}
/* Level-Pfad */
.levels{position:relative;display:flex;flex-direction:column;gap:20px;padding-left:66px}
.levels:before{content:"";position:absolute;left:28px;top:36px;bottom:36px;border-left:4px dashed rgba(255,255,255,.25)}
.lv{position:relative;border-radius:20px;padding:16px 20px;background:var(--glas);border:1.5px solid var(--glasrand)}
.lv .badge{position:absolute;left:-66px;top:14px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.5rem;background:#5a2f74;border:3px solid rgba(255,255,255,.35)}
.lv.aktiv{background:linear-gradient(135deg,rgba(255,213,74,.16),rgba(0,169,126,.14));border:2px solid var(--gold);box-shadow:0 0 40px rgba(255,213,74,.22)}
.lv.aktiv .badge{background:var(--gold);color:#1b2559;border-color:#fff}
.lv.zu{opacity:.62}
.lvkopf{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tag{font-size:.8rem;letter-spacing:.18em;color:var(--gold);font-weight:700}
.lvkopf h2{margin:2px 0 0;font-size:1.45rem;text-wrap:balance}
.lv.zu h2{color:#e6d3ef}
.klein{font-size:.85rem;color:var(--leise)}
.zahl{display:flex;align-items:center;gap:6px;color:#f5eafa;font-size:.95rem}
.zahl svg{width:20px;height:20px}
.bahn{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.bahn .linie{position:absolute;left:12.5%;right:12.5%;top:41px;height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
.bahn .linie i{display:block;height:100%;border-radius:3px;background:var(--gold)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;min-width:0}
.kreis{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-weight:800;background:#5a2f74;border:4px solid rgba(255,255,255,.3);color:#fff;padding:0;cursor:pointer}
.node.fertig .kreis{background:radial-gradient(circle at 35% 30%,#ffe98a,#f5b400);color:#5a3b00;border-color:#fff3c4}
.node.jetzt .kreis{background:#fff;color:#1b2559;border-color:var(--gold);box-shadow:0 0 0 8px rgba(255,213,74,.25),0 0 30px rgba(255,213,74,.7);animation:puls 2s ease-in-out infinite}
.node.zu .kreis{background:#3a1d4e;color:#a98bbd;cursor:not-allowed}
@keyframes puls{50%{box-shadow:0 0 0 14px rgba(255,213,74,.12),0 0 40px rgba(255,213,74,.9)}}
.node b{font-size:1rem}
.sterne{display:flex;gap:3px}
.sterne svg{width:28px;height:28px}
.btn{font:inherit;cursor:pointer;border:0;background:var(--gruen);color:#fff;font-weight:800;font-size:1rem;border-radius:999px;padding:9px 22px;box-shadow:0 5px 0 var(--gruend);touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gruend)}
.btn.hell{background:rgba(255,255,255,.14);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn.gold{background:var(--gold);color:#1b2559;box-shadow:0 5px 0 #b88a00}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.boss{background:linear-gradient(135deg,rgba(220,60,60,.22),rgba(255,213,74,.10));border:1.5px dashed rgba(255,120,120,.7)}
.boss .badge{background:#7a1f2b}
.boss.aktiv{border:2px solid #ff7a7a;box-shadow:0 0 40px rgba(255,90,90,.3)}
.boss.aktiv .badge{background:#d23a3a;color:#fff}
.bossrow{display:flex;align-items:center;gap:16px;margin-top:12px;flex-wrap:wrap}
details{border:1.5px dashed var(--glasrand);border-radius:12px;padding:8px 14px;color:var(--leise)}
summary{cursor:pointer}
.lehrer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
input[type=text]{font:inherit;border:2px solid var(--glasrand);background:rgba(0,0,0,.25);color:#fff;border-radius:10px;padding:8px 12px;width:12em;max-width:100%}
.msg{font-size:.9rem}
/* Spielfeld */
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.bar .titel{font-weight:700}
.bar .titel small{display:block;font-weight:400;color:var(--leise);font-size:.85rem}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.dot.ok{background:#3fd08a;border-color:#3fd08a} .dot.err{background:#ff6b6b;border-color:#ff6b6b} .dot.now{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.card{position:relative;background:var(--karte);color:var(--tinte);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.frage{font-size:1.3rem;font-weight:700;margin:0}
.fig{display:flex;justify-content:center}
.fig svg{width:100%;max-width:460px;height:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opts button{font:inherit;cursor:pointer;padding:14px 10px;font-size:1.1rem;font-weight:700;border:2.5px solid #1b2559;border-radius:14px;background:#fff;color:#1b2559;box-shadow:0 4px 0 #1b2559;touch-action:manipulation}
.opts button:disabled{cursor:default}
.opts button.richtig{background:var(--okbg);border-color:var(--ok);color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opts button.falsch{background:var(--errbg);border-color:var(--err);color:var(--err);box-shadow:0 4px 0 var(--err)}
.num{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:1.2rem}
.num input{font:inherit;font-size:1.3rem;width:6em;text-align:center;border:2.5px solid #1b2559;border-radius:12px;padding:8px;color:#111;background:#fff}
.fb{padding:12px 16px;font-weight:700;border-radius:12px}
.fb.ok{background:var(--okbg);color:var(--ok)} .fb.err{background:var(--errbg);color:var(--err)}

.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ende{align-items:center;text-align:center}
.ende .gross{display:flex;gap:10px}
.ende .gross svg{width:64px;height:64px}
.ende .frage{color:#1b2559}
/* Sternflug */
.flug{position:fixed;left:50%;top:45%;width:170px;height:170px;margin:-85px 0 0 -85px;z-index:50;pointer-events:none;filter:drop-shadow(0 0 25px rgba(255,213,74,.9))}
.glitzer{position:fixed;z-index:49;width:10px;height:10px;border-radius:50%;background:#fff3b0;pointer-events:none;box-shadow:0 0 12px #ffd54a}
.banner{background:linear-gradient(90deg,var(--gold),#ffe98a);color:#1b2559;font-weight:800;border-radius:14px;padding:10px 16px;text-align:center}
.fuss{text-align:right;color:var(--leise);font-size:.82rem;font-style:italic;margin:6px 0 0}
@media (max-width:640px){
  .bahn{grid-template-columns:repeat(2,minmax(0,1fr))}.bahn .linie{display:none}

.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 .12em;font-size:.95em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 .15em}
.frage .fr{font-size:1em}
.cG{color:#1565C0}.cW{color:#C2410C}.cP{color:#2e7d32}
.num .einheit{font-weight:700}
.opts button.gelb{background:#FFF3B0;border-color:#C99700;color:#7a5a00;box-shadow:0 4px 0 #C99700}
.num input.gelb{background:#FFF3B0;border-color:#C99700}
.fb.hinweis{background:#FFF3B0;color:#7a5a00}
.fb > span{display:block;font-weight:400;color:var(--tinte);margin-top:4px}
.fb span.fr{display:inline-flex;margin:0 .12em}.fb .fr span{display:block;margin:0}
.form{display:flex;flex-direction:column;gap:16px;font-size:1.25rem}
.glw,.glx{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.glb{display:inline-flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.glb .oben{border-bottom:3px solid #111;padding:0 6px 8px}
.glb > span:last-child{min-height:52px;display:flex;align-items:center;gap:6px}
.gleich{font-size:1.6rem;font-weight:700}
.form input.fx{font:inherit;font-size:1.25rem;width:5em;text-align:center;border:2.5px solid #1b2559;border-radius:12px;padding:6px;color:#111;background:#fff}
.form input.fx.satz{display:block;width:100%;box-sizing:border-box;text-align:left;margin-top:6px;font-weight:400}
.form input.fx.gelb{background:#FFF3B0;border-color:#C99700}
.form input.fx.gut{background:var(--okbg);border-color:var(--ok)}
.form input.fx.schlecht{background:var(--errbg);border-color:var(--err)}
.form .einheit,.satzlab{font-weight:700}
.dot.gelb{background:#ffd54a;border-color:#ffd54a}
.fehlz{font-weight:700;font-size:.95rem;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 14px}
.lv.master,.lv.master.aktiv{background:#141014;border:2px solid #d4af37;box-shadow:0 0 40px rgba(212,175,55,.22)}
.lv.master .badge{background:#d4af37;color:#2a1e00;border-color:#f5d77a}
.master .tag{color:#d4af37;letter-spacing:.22em}
.master h2,.master.zu h2{color:#f5d77a}
.master .klein{color:#cbb98a}
.master .zahl{color:#f5d77a}
.master .bahn{grid-template-columns:repeat(5,minmax(0,1fr))}
.master .bahn .linie{left:10%;right:10%;background:#4a3d2a}
.master .bahn .linie i{background:#d4af37}
.master .node.fertig .kreis{background:radial-gradient(circle at 35% 30%,#fff3c4,#d4af37);color:#2a1e00;border-color:#fff3c4}
.master .node.jetzt .kreis{background:#fff;color:#141014;border-color:#d4af37;box-shadow:0 0 0 8px rgba(212,175,55,.25),0 0 30px rgba(212,175,55,.7)}
.master .node.zu .kreis{background:#2a2228;color:#8a7a6a;border-color:#5a4a3a}
.master .btn{background:#d4af37;color:#2a1e00;box-shadow:0 5px 0 #8a6d14}
.mcred{display:flex;align-items:center;gap:4px;color:#f5d77a;font-weight:700}
.mcred svg{width:32px;height:32px}
.ende .mgross svg{width:90px;height:90px}
.fehlz.zuviel{background:#ff6b6b;border-color:#ff6b6b;color:#fff}
</style>

/* ================= Hilfen ================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rund=x=>Math.round(x*1e6)/1e6;
const dez=x=>String(rund(x)).replace(".",",");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const fr=(z,n)=>`<span class="fr"><span>${z}</span><span>${n}</span></span>`;
const G_=t=>`<b class="cG">${t}</b>`, W_=t=>`<b class="cW">${t}</b>`, P_=t=>`<b class="cP">${t}</b>`;
function mc(q,svg,correct,wrongs,ex){const w=[...new Set(wrongs.filter(x=>x!==correct))].slice(0,3);const opts=shuffle([correct,...w]);return{q,svg,opts,ans:opts.indexOf(correct),ex};}
const num=(q,n,unit,ex,svg)=>({q,svg,num:rund(n),unit,ex});
function feld(n){let s='<svg viewBox="0 0 204 204" style="max-width:220px">';for(let k=0;k<100;k++){const r=Math.floor(k/10),c=k%10;
  s+=`<rect x="${2+c*20}" y="${2+r*20}" width="20" height="20" fill="${k<n?"#7fb89a":"#fff"}" stroke="#555" stroke-width="1"/>`;}return s+'<rect x="2" y="2" width="200" height="200" fill="none" stroke="#000" stroke-width="2.5"/></svg>';}

/* 1-1 Umwandeln und Erweitern: 0★ Hundertstel · 1★ Zehntel und einstellige Hundertstel · 2★ Brüche erweitern (Viertel, Fünftel, Zwanzigstel …) */
const ERW1=[[1,10,10],[3,10,10],[7,10,10],[9,10,10],[1,2,50]];
const ERW2=[[1,4,25],[3,4,25],[1,5,20],[2,5,20],[3,5,20],[4,5,20],[1,20,5],[3,20,5],[7,20,5],[1,25,4],[7,25,4],[12,25,4],[9,50,2],[21,50,2],[1,2,50]];
function g1a(lv){
  if(lv===0){const p=rnd(11,99);const t=rnd(0,4);
    if(t===0)return num(`${fr(p,100)} = ? %`,p,"%",`${p} Hundertstel sind ${p} %.`);
    if(t===1)return num(`0,${String(p).padStart(2,"0")} = ? %`,p,"%",`Komma zwei Stellen nach rechts: 0,${p} = ${p} %.`);
    if(t===2)return mc(`${p} % als Dezimalzahl:`,"",dez(p/100),[dez(p/10),dez(p/1000),String(p)],`Komma zwei Stellen nach links: ${p} % = ${dez(p/100)}.`);
    if(t===3){const n=rnd(12,88);return num("Wie viel Prozent sind gefärbt?",n,"%",`${n} von 100 Kästchen sind gefärbt, also ${fr(n,100)} = ${n} %.`,feld(n));}
    const [z,n,f]=pick(ERW1.slice(0,4));return num(`Erweitere: ${fr(z,n)} = ${fr("?",100)}`,z*f,"",`Zähler und Nenner mal ${f}: ${fr(z,n)} = ${fr(z*f,100)}.`);}
  if(lv===1){const t=rnd(0,4);
    if(t===0){const z=rnd(1,9);return num(`0,${z} = ? %`,z*10,"%",`0,${z} = 0,${z}0 = ${z*10} %. Komma zwei Stellen nach rechts.`);}
    if(t===1){const p=rnd(1,9);return num(`0,0${p} = ? %`,p,"%",`Komma zwei Stellen nach rechts: 0,0${p} = ${p} %.`);}
    if(t===2){const p=pick([3,5,7,8,30,40,60,90]);return mc(`${p} % als Dezimalzahl:`,"",dez(p/100),[dez(p/10),dez(p/1000),String(p)],`Komma zwei Stellen nach links: ${p} % = ${dez(p/100)}.`);}
    if(t===3){const [z,n,f]=pick(ERW1);return num(`${fr(z,n)} = ? %`,z*f,"%",`Erweitern mit ${f}: ${fr(z,n)} = ${fr(z*f,100)} = ${z*f} %.`);}
    const z=rnd(1,9);return num(`${fr(z,10)} = ? %`,z*10,"%",`Erweitern mit 10: ${fr(z,10)} = ${fr(z*10,100)} = ${z*10} %.`);}
  const [z,n,f]=pick(ERW2);const t=rnd(0,3);
  if(t===0)return num(`${fr(z,n)} = ? %`,z*f,"%",`Erweitern mit ${f}: ${fr(z,n)} = ${fr(z*f,100)} = ${z*f} %.`);
  if(t===1)return num(`Womit erweiterst du ${fr(z,n)}, damit im Nenner 100 steht?`,f,"",`${n} · ${f} = 100. Also erweiterst du mit ${f}: ${fr(z,n)} = ${fr(z*f,100)}.`);
  if(t===2)return mc(`${fr(z,n)} als Dezimalzahl:`,"",dez(z*f/100),[dez(z/n*10),dez(z*f/1000),z+","+n],`${fr(z,n)} = ${fr(z*f,100)} = ${dez(z*f/100)}.`);
  const p=z*f;return mc(`Was ist NICHT gleich ${p} %?`,"",dez(p/1000),[fr(z,n),fr(p,100),dez(p/100)],`${p} % = ${fr(p,100)} = ${fr(z,n)} = ${dez(p/100)}. Aber ${dez(p/1000)} = ${dez(p/10)} %.`);
}

  const a=pick([0.4,0.6,1.2,2.5]),r=pick([a*10,a*10+1,a*10-1].map(rund));const z=rund(a*10)>r?">":rund(a*10)<r?"<":"=";

/* 1-3 G, W und p % erkennen */
const SIT=[
 (G,W,p)=>({t:`Von ${G} Kindern im Sportverein kommen ${W} mit dem Fahrrad zum Training. Das sind ${p} %.`,u:"Kinder",o:0}),
 (G,W,p)=>({t:`Eine Jacke kostet ${G} €. Im Sale spart man ${p} %, das sind ${W} €.`,u:"€",o:1}),
 (G,W,p)=>({t:`${p} % der ${G} Lose sind Gewinne. Das sind ${W} Lose.`,u:"Lose",o:2}),
 (G,W,p)=>({t:`Lisa hat ${W} von ${G} Punkten erreicht. Das sind ${p} %.`,u:"Punkte",o:0}),
 (G,W,p)=>({t:`Im Kino sind ${W} Plätze besetzt. Das sind ${p} % der ${G} Plätze.`,u:"Plätze",o:2}),
 (G,W,p)=>({t:`Ein Garten ist ${G} m² groß. Auf ${W} m² wachsen Blumen, das sind ${p} %.`,u:"m²",o:0}),
 (G,W,p)=>({t:`${W} € Rabatt gibt es auf einen Einkauf für ${G} €. Das sind ${p} %.`,u:"€",o:2})];
const PG=[[10,[20,30,40,50,60,80,120,200,250]],[20,[20,30,40,50,60,80,150,200]],[25,[20,40,60,80,120,200,400]],[50,[20,30,40,60,80,140,200]],[5,[20,40,60,80,200,300]],[75,[20,40,80,120,200]],[90,[20,30,50,60]]];
function situation(){let p,gs,G,W;do{[p,gs]=pick(PG);G=pick(gs);W=G*p/100;}while(W<2);const s=pick(SIT)(G,W,p);return{G,W,p,...s};}
function g1c(lv){
  const s=situation();const was=pick(["G","W","p"]);
  const name={G:"der Grundwert G",W:"der Prozentwert W",p:"der Prozentsatz p %"}[was];
  const wert={G:`${s.G} ${s.u}`,W:`${s.W} ${s.u}`,p:`${s.p} %`};
  const ex=`${G_("G = "+wert.G)} ist das Ganze, ${W_("W = "+wert.W)} ist der Teil davon, ${P_("p % = "+wert.p)} erkennst du am %-Zeichen.`;
  if(lv===0)return mc(`${s.t}<br>Was ist ${name}?`,"",wert[was],[wert.G,wert.W,wert.p,`${100-s.p} %`],ex);
  if(lv===1){const zahl=pick(["G","W","p"]);const nm={G:"Grundwert",W:"Prozentwert",p:"Prozentsatz"};
    return mc(`${s.t}<br>Was ist ${wert[zahl]}?`,"",nm[zahl],["Grundwert","Prozentwert","Prozentsatz","Promille"],ex);}
  const t=rnd(0,2);
  if(t===0)return mc("Welche Aussage stimmt?","",pick(["Der Grundwert entspricht 100 %.","Den Prozentsatz erkennt man am %-Zeichen.","Prozentwert und Grundwert haben dieselbe Einheit."]),
    ["Der Prozentwert entspricht 100 %.","Der Grundwert ist immer kleiner als der Prozentwert.","Der Prozentsatz hat immer die Einheit €."],"G ist das Ganze (100 %), W ist ein Teil davon mit derselben Einheit, p % hat das %-Zeichen.");
  return mc(`${s.t}<br>Was ist ${name}?`,"",wert[was],[wert.G,wert.W,wert.p,`${s.G-s.W} ${s.u}`],ex);
}

/* 1-4 Prozentwert im Kopf */
const KM={50:{w:": 2",f:G=>G/2},10:{w:": 10",f:G=>G/10},1:{w:": 100",f:G=>G/100},25:{w:": 4",f:G=>G/4},20:{w:": 5",f:G=>G/5},75:{w:": 4 · 3",f:G=>G/4*3}};
const KG={50:[20,40,60,80,90,140,160,300],10:[30,50,90,120,250,400,700],1:[100,200,300,500,700,900],25:[20,40,80,120,200,400],20:[20,35,50,60,80,150],75:[12,20,40,60,80,120]};
function g1d(lv){
  const ps=lv===0?[50,10,1]:lv===1?[25,20,50,10]:[75,25,20,10,1];
  const p=pick(ps);
  if(lv>=1&&rnd(0,3)===0)return mc(`Wie rechnest du ${p} % von G aus?`,"","G "+KM[p].w,Object.values(KM).map(k=>"G "+k.w),`${p} % = ${p===75?fr(3,4):fr(1,p===50?2:p===25?4:p===20?5:p===10?10:100)}. Also G ${KM[p].w}.`);
  let G=pick(KG[p]);if(lv===2&&p!==75&&rnd(0,1))G=pick({25:[10,30,50],20:[12,24,45],10:[35,45,75],1:[50,250,150]}[p]||[G]);
  const W=rund(KM[p].f(G));

/* ================= Level 2 · Prozentwert ================= */
/* Sterne: 0★ glatte Prozentsätze · 1★ Taschenrechner-Zahlen · 2★ Kommazahlen und über 100 % */
const P2=[[10,20,25,50,5,2,30,40,60,75,1],[3,7,8,12,14,15,17,22,35,45,65],[2.5,4.5,12.5,7.5,0.5,0.8,1.5,110,125,150]];
const G2=[[40,60,80,120,200,240,300,400,450,500,600,800],[150,250,350,480,500,650,700,900,1200,2400],[60,80,160,240,400,480,800,1200,2000,3500]];
const nk=x=>{const s=String(rund(x));return s.includes(".")?s.split(".")[1].length:0;};
function pw(lv,maxNk,ps,gs){ps=ps||P2[lv];gs=gs||G2[lv];
  for(let k=0;k<400;k++){const p=pick(ps),G=pick(gs),W=rund(G*p/100);if(nk(W)<=maxNk&&G!==p)return{p,G,W};}
  return{p:10,G:450,W:45};}
const zahl=s=>{let t=String(s).replace(/\s/g,"").replace(/[%‰€°]/g,"");if(/^[1-9]\d{0,2}(\.\d{3})+(,\d+)?$/.test(t))t=t.replace(/\./g,""); /* Tausenderpunkt: 1.200 = 1200 */
  return parseFloat(t.replace(",","."));};
const gleich=(a,b)=>!isNaN(a)&&Math.abs(a-b)<1e-9;
const eqN=(s,n)=>gleich(zahl(s),n);
const eqX=s=>String(s).trim().toLowerCase()==="x";
const fmt=(W,u)=>u==="€"&&nk(W)===1?W.toFixed(2).replace(".",","):dez(W);
const glZeile=(G,p)=>`${fr(G_(G),"100 %")} = ${fr(W_("x"),P_(dez(p)+" %"))}`;
const kreuz=(G,p,W)=>`x = ${G} · ${dez(p)} : 100 = ${dez(W)}`;
const fx=(k,lab,mode)=>`<input type="text" class="fx" data-k="${k}" inputmode="${mode||"decimal"}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${lab}">`;
const glForm=()=>glForm4();

/* 2-1 Verhältnisgleichung: Aufgabe 1–3 nur einsetzen · 4–6 einsetzen und ausrechnen · 7–10 auf Papier, nur Ergebnis */
function g2a(lv,i){
  if(i==null)i=rnd(0,9);
  const {p,G,W}=pw(lv,lv?2:0), auf=`${dez(p)} % von ${G}`;
  const ex=`Hinter „von“ steht ${G_("G = "+G)}, ${P_("p % = "+dez(p)+" %")}, gesucht ist ${W_("W = x")}.<br>${glZeile(G,p)} → ${kreuz(G,p,W)}`;
  const muster=[[G,100,"x",p],["x",p,G,100]];
  const tipp=v=>eqN(v[0],p)&&eqN(v[2],G)?"G und p % sind vertauscht. Was ist das Ganze? Hinter „von“ steht G.":!v.slice(0,4).some(eqX)?"Schreibe für die gesuchte Größe x.":!v.slice(0,4).some(t=>eqN(t,100))?"Das Ganze G entspricht 100 %.":"";
  if(i<3)return{q:`Stelle die Verhältnisgleichung auf: <b>${auf}</b>`,form:glForm(),kat:G+"|"+p,
    check:v=>glPruef(v,muster,W),tipp,loes:glZeile(G,p),ex};
  if(i<6)return{q:`Stelle die Verhältnisgleichung auf und rechne aus: <b>${auf}</b>`,
    form:glForm()+`<div class="glx">x = ${fx(4,"Ergebnis x")}</div>`,kat:String(W),
    check:v=>[...glPruef(v,muster,W),eqN(v[4],W)],tipp,loes:`${glZeile(G,p)} und x = ${dez(W)}`,ex};
  return Object.assign(num(`Rechne auf Papier mit der Verhältnisgleichung. Trage nur das Ergebnis ein.<br><b>${auf}</b> = ?`,W,"",ex),{label:"W ="});
}

/* 2-2 Taschenrechner: Aufgabe 1–3 nur die Eingabe · 4–10 nur das Ergebnis */
function g2b(lv,i){
  if(i==null)i=rnd(0,9);
  const {p,G,W}=pw(lv,lv?2:0), d=rund(p/100), auf=`${dez(p)} % von ${G}`;
  const falle=Number.isInteger(p)&&p<10?` Achtung: ${p} % = ${dez(d)}, nicht ${dez(p/10)}.`:"";
  const ex=`${P_(dez(p)+" %")} = ${P_(dez(d))}. Eingabe: ${dez(d)} · ${G} = ${dez(W)}.${falle}`;
  if(i<3)return{q:`Was tippst du in den Taschenrechner? <b>${auf}</b>`,
    form:`<div class="glw">${fx(0,"erste Zahl")}<span class="gleich">·</span>${fx(1,"zweite Zahl")}</div>`,kat:dez(d)+"|"+G,
    check:v=>{const a=zahl(v[0]),b=zahl(v[1]);return[(gleich(a,d)&&!gleich(b,d))||(gleich(a,G)&&!gleich(b,G)),(gleich(b,d)&&!gleich(a,d))||(gleich(b,G)&&!gleich(a,G))];},
    tipp:v=>v.some(x=>eqN(x,p)||eqN(x,p/10))?"Schreibe den Prozentsatz als Dezimalzahl.":"",
    loes:`${dez(d)} · ${G}`,ex};
  return Object.assign(num(`Berechne mit dem Taschenrechner: <b>${auf}</b> = ?`,W,"",ex),{label:"W ="});
}

/* 2-3 Sachaufgaben: Ergebnis und Antwortsatz, Runde = 5 Aufgaben */
const SACH=[

/* ================= Gemeinsame Hilfen (Verhältnisgleichung prüfen, Sachaufgaben) ================= */
const cent=x=>Math.round(x*100)/100;

const eqC=(s,n)=>eqN(s,cent(n));
const glWert=s=>eqX(s)?"x":zahl(s);
/* Jede richtig aufgestellte Verhältnisgleichung zählt: genau ein x, oben die Größen, unten die Prozentsätze, Kreuzprodukt stimmt.

function glPruef(v,muster,u){
  const w=v.slice(0,4).map(glWert), z=w.map(t=>t==="x"?u:t);
  const ms=a=>a.map(t=>rund(t)).sort((p,q)=>p-q).join("|"), m0=muster[0].map(t=>t==="x"?u:t);
  const ok=w.filter(t=>t==="x").length===1&&!z.some(t=>typeof t!=="number"||isNaN(t))&&
    ms([z[0],z[2]])===ms([m0[0],m0[2]])&&ms([z[1],z[3]])===ms([m0[1],m0[3]])&&
    Math.abs(z[0]*z[3]-z[1]*z[2])<=1e-6*Math.max(1,Math.abs(z[0]*z[3]));

    ex:`Bruttopreis ${eur(B)} € ≙ ${h} %, MwSt. ≙ ${p} %.<br>${fr(eur(B),h+" %")} = ${fr("x",p+" %")} → x = ${eur(B)} · ${p} : ${h} ${glatt?"=":"≈"} ${eur(M)} → MwSt. ${eur(M)} €, netto ${eur(B-M)} €<br>Falle: ${p} % von ${eur(B)} € = ${eur(falsch)} € ist falsch, weil ${eur(B)} € schon ${h} % sind.`};
}
function vergleichAufgabe(){
  const [ding,pr]=pick(WARE);
  for(let k=0;k<300;k++){
    const PA=pick([60,80,90,100,120,150]),pa=pick([10,15,20,25]);
    const mitSkonto=rnd(0,1)===1, PB=PA+pick([-10,-5,5,10]), pb=mitSkonto?pick([2,3]):pick([20,25,30,35]);
    const NA=cent(PA*(100-pa)/100),NB=cent(PB*(100-pb)/100);
    if(PB<=0||Math.abs(NA-NB)<1||PA===PB&&pa===pb)continue;
    const bA=NA<NB, L=bA?"A":"B", N=bA?NA:NB, D=cent(Math.abs(NA-NB)), muster=`Shop ${L} ist günstiger, dort kostet ${pr} nur ${eur(N)} €.`;
    const akk=pr==="er"?ding.replace(/^Ein /,"einen "):klein(ding);
    const txtB=mitSkonto?`Shop B verkauft ${pr==="er"?"ihn":pr} für ${PB} € und gibt ${pb} % Skonto, wenn du sofort bezahlst.`:`Shop B verkauft ${pr==="er"?"ihn":pr} für ${PB} € mit ${pb} % Rabatt.`;
    return{q:`Du willst ${akk} kaufen. Shop A verkauft ${pr==="er"?"ihn":pr} für ${PA} € mit ${pa} % Rabatt. ${txtB} Wo ist es günstiger?`,kat:L+N,
      form:ergF(0,"Preis in Shop A =","€")+ergF(1,"Preis in Shop B =","€")+satzF(2),
      check:v=>[eqC(v[0],NA),eqC(v[1],NB),satzPruef(v[2],N,"€").ok&&nennt(v[2],"shop",L)],
      tipp:(v,r)=>(eqC(v[0],cent(PA*pa/100))||eqC(v[1],cent(PB*pb/100)))?"Gesucht ist der Preis, den du am Ende zahlst, nicht der Rabatt.":(!r[0]||!r[1])?"":
        !nennt(v[2],"shop",L)?"Schreibe im Antwortsatz, welcher Shop günstiger ist (Shop A oder Shop B).":satzTipp(v[2],N,"€"),
      loes:`Shop A: ${eur(NA)} €, Shop B: ${eur(NB)} €. Antwort: „${muster}“`,
      ex:`Shop A: 100 % − ${pa} % = ${100-pa} % → x = ${PA} · ${100-pa} : 100 = ${eur(NA)} €<br>Shop B: 100 % − ${pb} % = ${100-pb} % → x = ${PB} · ${100-pb} : 100 = ${eur(NB)} €<br>Shop ${L} ist um ${eur(D)} € günstiger.`};
  }
  return rabattAufgabe(1,0);
}
function g5a(lv,i){
  if(i==null)i=rnd(0,4);
  if(lv===0)return rabattAufgabe(0,i);
  if(lv===1)return i<2?rabattAufgabe(1,i):i===2?skontoAufgabe():nettoAufgabe(i===4);
  return i<2?bruttoAufgabe(false):i===2?bruttoAufgabe(true):vergleichAufgabe();
}

/* ---------- Diagramme zeichnen ---------- */
const FARB=["#4C9BE8","#F28C52","#5DBB63","#F4C542","#A77BD8","#4DC3C9"];
const UMFR=[
 {t:"Speicher auf deinem Handy",k:["Fotos","Videos","Apps","frei"]},
 {t:"Handy-Zeit pro Tag",k:["Chat","Musik","Spiele","Sonstiges"]},
 {z:1,t:"Wie kommst du zur Schule?",k:["Bus","Fahrrad","zu Fuß","Auto"]},
 {z:1,t:"Lieblings-Streamingdienst",k:["Netflix","YouTube","Disney+","Sonstige"]},
 {z:1,t:"Lieblingssport der Klasse 7",k:["Fußball","Volleyball","Schwimmen","Tanzen"]},
 {z:1,t:"Lieblingsessen in der Mensa",k:["Pizza","Nudeln","Burger","Salat"]},
 {z:1,t:"Wofür gibst du dein Taschengeld aus?",k:["Essen","Kleidung","Spiele","Sparen"]}];
const tit=u=>u.t.endsWith("?")?`Umfrage „${u.t}“`:u.t;
const polar=(cx,cy,r,d)=>{const a=(d-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
const f1=x=>x.toFixed(1);
function sektor(cx,cy,r,a0,a1,farbe){
  if(a1-a0>=359.99)return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${farbe}" stroke="#222" stroke-width="2"/>`;
  const [x0,y0]=polar(cx,cy,r,a0),[x1,y1]=polar(cx,cy,r,a1);
  return `<path d="M${cx} ${cy}L${f1(x0)} ${f1(y0)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${f1(x1)} ${f1(y1)}Z" fill="${farbe}" stroke="#222" stroke-width="2" stroke-linejoin="round"/>`;}
function bogen(cx,cy,a0,a1,txt){ /* Winkelbogen mit der Gradzahl darin */
  const r=64,[x0,y0]=polar(cx,cy,r,a0),[x1,y1]=polar(cx,cy,r,a1),[tx,ty]=polar(cx,cy,40,(a0+a1)/2);
  const pfad=a1-a0>=359.99?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#111" stroke-width="2"/>`:
    `<path d="M${f1(x0)} ${f1(y0)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${f1(x1)} ${f1(y1)}" fill="none" stroke="#111" stroke-width="2"/>`;
  return pfad+`<text x="${f1(tx)}" y="${f1(ty)}" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">${txt}</text>`;}
function legende(x,y,eintr){return eintr.map((e,k)=>`<rect x="${x}" y="${y+k*34}" width="22" height="22" rx="4" fill="${e.f}" stroke="#222" stroke-width="1.5"/><text x="${x+32}" y="${y+k*34+16}" font-size="17" fill="#111">${e.t}</text>`).join("");}
/* sek: [{name, deg, leg (Text in der Legende), grad (Gradzahl zeigen)}] */
function kreisDia(sek){
  let s=`<svg viewBox="0 0 480 300" role="img" aria-label="Kreisdiagramm">`,a=0;
  sek.forEach((t,k)=>{s+=sektor(150,150,125,a,a+t.deg,FARB[k]);a+=t.deg;});
  a=0;sek.forEach(t=>{if(t.grad)s+=bogen(150,150,a,a+t.deg,dez(t.deg)+"°");a+=t.deg;});
  return s+legende(305,60,sek.map((t,k)=>({f:FARB[k],t:t.leg||t.name})))+`</svg>`;}
function skala(y){let s=`<line x1="30" y1="${y}" x2="430" y2="${y}" stroke="#111" stroke-width="1.5"/>`;
  for(let k=0;k<=20;k++){const x=30+k*20,g=k%2===0;s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+(g?10:5)}" stroke="#111" stroke-width="1.5"/>`;if(g)s+=`<text x="${x}" y="${y+26}" font-size="14" text-anchor="middle" fill="#111">${k/2}</text>`;}
  return s+`<text x="448" y="${y+26}" font-size="14" fill="#111">cm</text>`;}
/* seg: [{name, cm, leg}] – 10 cm = 400 px */
function streifenDia(seg,ohneRahmen){
  let s=`<svg viewBox="0 0 480 ${60+44+Math.ceil(seg.length/2)*34}" role="img" aria-label="Streifendiagramm">`,x=30;
  seg.forEach((t,k)=>{const w=t.cm*40;s+=`<rect x="${f1(x)}" y="14" width="${f1(w)}" height="46" fill="${FARB[k]}" stroke="#222" stroke-width="2"/>`;x+=w;});
  if(!ohneRahmen)s+=`<rect x="30" y="14" width="400" height="46" fill="none" stroke="#222" stroke-width="2"/>`;
  s+=skala(66);
  seg.forEach((t,k)=>{const sp=k%2,zl=Math.floor(k/2);s+=legende(30+sp*220,110+zl*34,[{f:FARB[k],t:t.leg||t.name}]);});
  return s+`</svg>`;}
function streifenLive(v,name){
  const zuLang=v>10, cm=isNaN(v)||v==null?0:Math.max(0,Math.min(10,v));
  let s=`<svg viewBox="0 0 480 140" role="img" aria-label="Streifen"><rect x="30" y="14" width="400" height="46" fill="#fff" stroke="#222" stroke-width="2"/>`;
  if(cm>0)s+=`<rect x="30" y="14" width="${f1(cm*40)}" height="46" fill="${FARB[0]}" stroke="#222" stroke-width="2"/>`+(cm*40>=70?`<text x="${f1(30+cm*20)}" y="43" font-size="16" font-weight="700" text-anchor="middle" fill="#111">${esc(name)}</text>`:"");
  return s+skala(66)+`<text x="30" y="128" font-size="15" fill="#555">${zuLang?`${dez(v)} cm passen nicht: Der ganze Streifen ist nur 10 cm lang.`:cm>0?`Dein Abschnitt: ${dez(cm)} cm`:"Gib die Länge ein. Dann wächst dein Abschnitt."}</text></svg>`;}
function kreisLive(v,name){
  const d=isNaN(v)||v==null?0:Math.max(0,Math.min(360,v));
  let s=`<svg viewBox="0 0 300 300" style="max-width:300px" role="img" aria-label="Kreis"><circle cx="150" cy="150" r="125" fill="#fff" stroke="#222" stroke-width="2"/><line x1="150" y1="150" x2="150" y2="25" stroke="#222" stroke-width="2"/>`;
  if(d>0)s+=sektor(150,150,125,0,d,FARB[1])+bogen(150,150,0,d,dez(d)+"°");
  return s+`<circle cx="150" cy="150" r="3" fill="#111"/></svg><div style="text-align:center;color:#555;font-size:.95rem">${d>0?`Dein Ausschnitt für „${esc(name)}“`:"Gib den Winkel ein. Dann dreht sich dein Kreisausschnitt auf."}</div>`;}
function teile(n,schritt,min){ /* n Prozentsätze, Vielfache von schritt, jeder ≥ min, Summe 100 */
  for(let k=0;k<500;k++){const a=[];let rest=100;
    for(let j=0;j<n-1;j++){const max=rest-min*(n-1-j);const opts=[];for(let p=min;p<=max;p+=schritt)opts.push(p);if(!opts.length)break;const p=pick(opts.filter(q=>q<=60));if(p==null)break;a.push(p);rest-=p;}
    if(a.length===n-1&&rest>=min&&rest%schritt===0){a.push(rest);return shuffle(a);}}
  return[40,30,20,10];}

/* 5-2 Diagramme zeichnen (10 Aufgaben): 0★ Zehnerprozente · 1★ Komma-cm, Winkel aus Fünferprozenten · 2★ Runden auf ganze Grad, Prozentsatz erst aus Anzahlen */
function g5b(lv,i){
  if(i==null)i=rnd(0,9);
  const u=pick(lv===2&&i>=5?UMFR.filter(x=>x.z):UMFR),name=pick(u.k),kreis=i%2===1; /* z: echte Umfragen, bei denen Schüler abstimmen */

/* 5-3 Diagramme ablesen (10 Aufgaben): 0★ Halb-/Viertelkreis, Streifen mit ganzen cm · 1★ Prozentsatz aus dem Winkel, Streifen mit halben cm, Anzahl berechnen · 2★ „Stimmt das?“, Anzahl berechnen */
const STIMMT=["Stimmt.","Stimmt nicht: Zusammen sind es nicht 100 %.","Stimmt nicht: Ein Abschnitt ist falsch gezeichnet."];
function stimmtDas(){
  const u=pick(UMFR),art=pick(["ok","ok","summe","falsch"]),kreis=rnd(0,1)===1;
  const ps=teile(4,5,10);let leg=ps.slice(),zeich=ps.slice(),erk;
  if(art==="summe"){const k=rnd(0,3),d=pick([5,10,-5]);if(leg[k]+d<5)leg[k]+=5;else leg[k]+=d;
    const s=leg.reduce((a,b)=>a+b,0);zeich=leg.map(p=>p*100/s);erk=`${leg.map(p=>p+" %").join(" + ")} = ${s} % ≠ 100 %. Also stimmt das Diagramm nicht.`;}
  else if(art==="falsch"){const k=rnd(0,3),j=(k+1+rnd(0,2))%4,d=Math.min(10,ps[j]-5);zeich[k]+=d;zeich[j]-=d;
    erk=kreis?`„${u.k[k]}“ hat ${ps[k]} %, also ${ps[k]} · 3,6 = ${dez(ps[k]*3.6)}°. Gezeichnet sind aber ${dez(zeich[k]*3.6)}°.`:`„${u.k[k]}“ hat ${ps[k]} %, also ${ps[k]} : 10 = ${dez(ps[k]/10)} cm. Gezeichnet sind aber ${dez(zeich[k]/10)} cm.`;}
  else erk=`Zusammen sind es ${leg.join(" % + ")} % = 100 %, und jeder Abschnitt passt: ${kreis?ps.map(p=>`${p} % ≙ ${dez(p*3.6)}°`).join(", "):ps.map(p=>`${p} % ≙ ${dez(p/10)} cm`).join(", ")}.`;
  const zeigGrad=kreis&&art!=="summe";
  const svg=kreis?kreisDia(zeich.map((p,k)=>({name:u.k[k],deg:rund(p*3.6),leg:`${u.k[k]}: ${leg[k]} %`,grad:zeigGrad}))):
    streifenDia((art==="summe"?leg:zeich).map((p,k)=>({name:u.k[k],cm:p/10,leg:`${u.k[k]}: ${leg[k]} %`})));
  const ok=art==="ok"?STIMMT[0]:art==="summe"?STIMMT[1]:STIMMT[2];
  return Object.assign(mc(`${tit(u)}: Stimmt das ${kreis?"Kreisdiagramm":"Streifendiagramm"}? Prüfe ${kreis?"die Winkel":"die Längen"} und die Prozente.`,svg,ok,STIMMT.filter(x=>x!==ok),erk),{kat:ok});
}
function g5c(lv,i){
  if(i==null)i=rnd(0,9);
  let u=pick(UMFR);
  if(lv===0){
    if(i%2===0){const ziel=pick([50,25,50,25,75]);let rest;
      for(let k=0;k<100;k++){rest=teile(ziel===75?1:ziel===50?2:3,5,10).map(p=>p*(100-ziel)/100);if(rest.every(p=>p>=5&&Number.isInteger(p)))break;}
      const ps=[ziel,...rest],k0=0,svg=kreisDia(ps.map((p,k)=>({name:u.k[k],deg:p*3.6})));
      const art=ziel===50?"ein Halbkreis":ziel===25?"ein Viertelkreis":"drei Viertel des Kreises";
      return Object.assign(mc(`${tit(u)}: Wie viel Prozent hat „${u.k[k0]}“?`,svg,ziel+" %",[...["50 %","25 %","75 %"].filter(x=>x!==ziel+" %"),ziel*36/10+" %"],`„${u.k[k0]}“ ist ${art}: ${ziel===50?"180° = 50 %":ziel===25?"90° = 25 %":"270° = 75 %"}.`),{kat:String(ziel)});}
    const ps=teile(4,10,10),k=rnd(0,3);
    return Object.assign(num(`${tit(u)}: Lies ab. Wie viel Prozent hat „${u.k[k]}“?`,ps[k],"%",`Der Abschnitt ist ${ps[k]/10} cm lang. p = Länge in cm · 10 → ${ps[k]/10} · 10 = ${ps[k]} %.`,streifenDia(ps.map((p,j)=>({name:u.k[j],cm:p/10})))),{label:"p =",kat:String(ps[k])});
  }
  const typ=lv===1?i%3:(i<5?3:2);
  if(typ===3)return stimmtDas();
  const ps=teile(4,5,10),k=rnd(0,3);
  if(typ===0){const d=rund(ps[k]*3.6);
    return Object.assign(num(`${tit(u)}: Wie viel Prozent hat „${u.k[k]}“?`,ps[k],"%",`p = Winkel : 3,6 → ${dez(d)} : 3,6 = ${ps[k]} %.<br>(Oder: x = ${dez(d)} · 100 : 360 = ${ps[k]})`,
      kreisDia(ps.map((p,j)=>({name:u.k[j],deg:rund(p*3.6),grad:j===k})))),{label:"p =",kat:String(ps[k]),tipp:v=>gleich(v,d)?"Das ist der Winkel. Rechne ihn in Prozent um: 3,6° ≙ 1 %.":""});}
  if(typ===1){const ps2=ps.filter(p=>p%10===5).length?ps:teile(4,5,10);
    return Object.assign(num(`${tit(u)}: Lies ab. Wie viel Prozent hat „${u.k[k]}“?`,ps2[k],"%",`Der Abschnitt ist ${dez(ps2[k]/10)} cm lang. p = Länge in cm · 10 → ${dez(ps2[k]/10)} · 10 = ${ps2[k]} %.`,
      streifenDia(ps2.map((p,j)=>({name:u.k[j],cm:p/10})))),{label:"p =",kat:String(ps2[k])});}
  /* Anzahl berechnen: nur echte Umfragen */
  u=pick(UMFR.filter(x=>x.z));
  const G=pick([20,40,60]),W=G*ps[k]/100,kreis=lv===2?rnd(0,1)===1:true,d=rund(ps[k]*3.6);
  const svg=kreis?kreisDia(ps.map((p,j)=>({name:u.k[j],deg:rund(p*3.6),grad:j===k}))):streifenDia(ps.map((p,j)=>({name:u.k[j],cm:p/10})));
  const ablesen=kreis?`p = ${dez(d)} : 3,6 = ${ps[k]} %`:`p = ${dez(ps[k]/10)} · 10 = ${ps[k]} %`;
  return Object.assign(num(`${tit(u)}: ${G} Schüler wurden befragt. Wie viele haben „${u.k[k]}“ gewählt?`,W,"",
    `Ablesen: ${ablesen}.<br>${glZeile(G,ps[k])} → x = ${G} · ${ps[k]} : 100 = ${W}. Also ${W} Schüler.`,svg),
    {label:"Anzahl =",kat:String(W),tipp:v=>gleich(v,ps[k])?"Das ist der Prozentsatz. Wie viele Schüler sind das von "+G+"?":""});
}

/* 5-4 Zinsen (Sachaufgaben, Runde = 5): 0★ Begriffe, Zinsen · 1★ Zinsen, Zinssatz, Kapital · 2★ Zinssatz/Kapital, Sparangebote vergleichen, Ratenzahlung */
const SPARER=[["Lena","sie"],["Ben","er"],["Mia","sie"],["Luca","er"],["Emma","sie"],["Noah","er"],["Lea","sie"],["Finn","er"]];
const HERKUNFT=["von der Jugendweihe","aus dem Ferienjob","zum Geburtstag","vom Taschengeld","von der Konfirmation"];
function begriffe(){
  const P=[["das Kapital K","dem Grundwert G"],["die Zinsen Z","dem Prozentwert W"],["der Zinssatz p %","dem Prozentsatz p %"]];
  const [a,b]=pick(P),rev=rnd(0,1)===1;
  const ex="Kapital K ↔ Grundwert G<br>Zinsen Z ↔ Prozentwert W<br>Zinssatz p % ↔ Prozentsatz p %";
  if(rev){const ziel=a.replace(/^(das|die|der) /,""),alle=P.map(x=>x[0].replace(/^(das|die|der) /,""));
    return Object.assign(mc(`Zinsrechnung ist Prozentrechnung. Was entspricht ${b}?`,"",ziel,alle.concat(["der Bonus"]),ex),{kat:ziel});}
  const ziel=b.replace(/^dem /,"").replace(/^(\w)/,m=>m),alle=P.map(x=>x[1].replace(/^dem /,""));
  return Object.assign(mc(`Zinsrechnung ist Prozentrechnung. ${a.charAt(0).toUpperCase()+a.slice(1)} entspricht …`,"",ziel,alle.concat(["dem Promille"]).map(x=>x.replace(/^dem /,"")),ex),{kat:ziel});
}
function zinsen(lv){
  const [n,pr]=pick(SPARER);let K,p,Z;
  for(let k=0;k<200;k++){K=lv===0?pick([100,200,300,400,500,600,800,1000]):pick([240,360,450,750,1200,350,650]);p=lv===0?pick([1,2,3,4,5]):pick([1.5,2.5,0.5,3.5,2,3]);Z=cent(K*p/100);if(gleich(Z,K*p/100))break;}
  const muster=`${n} bekommt ${eur(Z)} € Zinsen.`;
  return{q:`${n} hat ${K} € ${pick(HERKUNFT)} bekommen und legt das Geld für ein Jahr bei der Bank an. Die Bank zahlt ${dez(p)} % Zinsen. Wie viel Euro Zinsen bekommt ${pr} nach einem Jahr?`,kat:String(Z),
    form:ergF(0,"Z =","€")+satzF(1),check:v=>[eqC(v[0],Z),satzPruef(v[1],Z,"€").ok],
    tipp:(v,r)=>eqC(v[0],K+Z)?"Gesucht sind nur die Zinsen, nicht das ganze Guthaben.":r[0]?satzTipp(v[1],Z,"€"):"",
    loes:`Z = ${eur(Z)} €. Antwort: „${muster}“`,

function sparvergleich(){

  const [ding,pr]=pick(WARE);let G,r,N;

  const kat=a=>a.kat||(a.opts?a.opts[a.ans]:a.q);
  while(R.aufgaben.length<R.n){
    const a=spiel.gen(lv,R.aufgaben.length), k=schluessel(a), n=R.aufgaben.length, vorher=n?schluessel(R.aufgaben[n-1]):letzte;
    versuche++;
    if(k===vorher)continue;                                   /* nie zweimal dieselbe Aufgabe hintereinander */
    if(versuche<2000){
      if(seen.has(k))continue;                                /* keine Wiederholung in der Runde */
      if(n>=2&&kat(R.aufgaben[n-1])===kat(a)&&kat(R.aufgaben[n-2])===kat(a))continue; /* höchstens 2x dieselbe Lösung hintereinander */
      if(a.grenz&&grenz>=2)continue;                          /* Grenzwerte (89°, 181° …) höchstens zweimal */
    }
    if(a.grenz)grenz++;
    seen.add(k);R.aufgaben.push(a);
  }
  letzte=schluessel(R.aufgaben[R.n-1]);
  show();
}
const punkte=()=>`<div class="dots" aria-label="Fortschritt">${R.aufgaben.map((_,i)=>`<span class="dot ${R.res[i]===true?"ok":R.res[i]==="gelb"?"gelb":R.res[i]===false?"err":i===R.i?"now":""}"></span>`).join("")}</div>`;
const fehlerAnzeige=()=>{const f=R.res.filter(x=>x===false).length;if(R.master){const z=R.res.filter(x=>x==="gelb").length;return `<span id="fehlz" class="fehlz${f>0||z>2?" zuviel":""}">Fehler: ${f} (erlaubt: 0) · Zweitversuche: ${z} (erlaubt: 2)</span>`;}return `<span id="fehlz" class="fehlz${f>erlaubt(R.n)?" zuviel":""}">Fehler: ${f} (erlaubt: ${erlaubt(R.n)})</span>`;};
function kopf(){
  const name=R.id==="m"?"Endgegner":R.master?`Master ${R.spiel.nr}: ${R.spiel.name}`:`Spiel ${R.spiel.nr}: ${R.spiel.name}`;
  return `<div class="bar"><span class="titel">${name}<small>${R.master?"💎 Master-Level":"Schwierigkeit "+"★".repeat(R.lv+1)}</small></span>${fehlerAnzeige()}<button class="btn hell" id="abbr">Zur Übersicht</button></div>${punkte()}`;
}
function show(){
  const a=R.aufgaben[R.i];R.versuch=0;
  const T=x=>HTML?x:esc(x), EINH=a.unit!=null?a.unit:STD_EINHEIT;
  let h=kopf()+`<section class="card"><p class="frage">${T(a.q)}</p>${a.svg||a.live?`<div class="fig" id="fig">${a.live?a.live(null):a.svg}</div>`:""}`;
  if(a.opts)h+=`<div class="opts">${a.opts.map((o,i)=>`<button data-o="${i}">${T(o)}</button>`).join("")}</div>`;
  else if(a.form)h+=`<div class="form">${a.form}<div><button class="btn" type="button" id="pruefBtn">Prüfen</button></div></div>`;
  else h+=`<div class="num" id="numForm"><label for="ein">${a.label||"Antwort:"}</label><input type="text" id="ein" inputmode="decimal" autocomplete="off"> <span class="einheit">${EINH}</span><button class="btn" type="button" id="pruefBtn">Prüfen</button></div>`;
  h+=`<div id="fb"></div></section>`;
  app.innerHTML=h;
  document.getElementById("abbr").addEventListener("click",home);
  const hinweis=(extra)=>{document.getElementById("fb").innerHTML=`<div class="fb hinweis">Prüfe noch einmal! <span>Du hast noch einen zweiten Versuch.${extra?" "+extra:""}</span></div>`;};
  if(a.opts)app.querySelectorAll("[data-o]").forEach(b=>b.addEventListener("click",()=>{
    const k=+b.dataset.o;
    if(k!==a.ans&&R.versuch===0){R.versuch=1;b.classList.add("gelb");b.disabled=true;hinweis();return;}
    app.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;x.classList.remove("gelb");if(+x.dataset.o===a.ans)x.classList.add("richtig");});
    if(k!==a.ans)b.classList.add("falsch");feedback(k===a.ans,a);}));
  else if(a.form){const ins=[...app.querySelectorAll(".fx")], btnP=document.getElementById("pruefBtn");ins[0].focus();
    ins.forEach(x=>x.addEventListener("input",()=>x.classList.remove("gelb")));
    const pruef=()=>{const v=ins.map(x=>x.value);
      if(v.some(x=>!x.trim())){document.getElementById("fb").innerHTML=`<div class="fb hinweis">Fülle zuerst alle Felder aus.</div>`;return;}
      const r=a.check(v), ok=r.every(Boolean);
      if(!ok&&R.versuch===0){R.versuch=1;ins.forEach((x,k)=>x.classList.toggle("gelb",!r[k]));hinweis(a.tipp?a.tipp(v,r):"");return;}
      ins.forEach((x,k)=>{x.disabled=true;x.classList.remove("gelb");x.classList.add(r[k]?"gut":"schlecht");});btnP.disabled=true;feedback(ok,a);};
    btnP.addEventListener("click",pruef);ins.forEach(x=>x.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();pruef();}}));}
  else{const inp=document.getElementById("ein");inp.focus();
    inp.addEventListener("input",()=>{inp.classList.remove("gelb");if(a.live)document.getElementById("fig").innerHTML=a.live(zahl(inp.value));});
    const btnP=document.getElementById("pruefBtn");const pruef=()=>{
      const v=zahl(inp.value);if(isNaN(v))return;
      const ok=Math.abs(v-a.num)<1e-9;
      if(!ok&&R.versuch===0){R.versuch=1;inp.classList.add("gelb");hinweis(a.tipp?a.tipp(v):"");inp.select();return;}
      inp.classList.remove("gelb");inp.disabled=true;btnP.disabled=true;feedback(ok,a);};
    btnP.addEventListener("click",pruef);inp.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();pruef();}});}
}
function feedback(ok,a){
  R.res[R.i]=ok?(R.versuch?"gelb":true):false;const EINH=a.unit!=null?a.unit:STD_EINHEIT;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"err"}">${ok?(R.versuch?"Richtig – im zweiten Versuch!":"Richtig!"):"Leider falsch."+(a.loes?` Richtig ist: ${a.loes}`:a.num!=null?` Richtig ist ${dez(a.num)}${EINH?(EINH==="°"?"":" ")+EINH:""}.`:"")}<span class="ex">${HTML?a.ex:esc(a.ex)}</span></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="weiter">${R.i<R.n-1?"Weiter ▶":"Zum Ergebnis ▶"}</button></div>`;
  app.querySelector(".dots").outerHTML=punkte();
  const fz=document.getElementById("fehlz");if(fz)fz.outerHTML=fehlerAnzeige();
  const w=document.getElementById("weiter");w.focus();
  w.addEventListener("click",()=>{R.i++;R.i<R.n?show():ende();});
}
function geschafftText(){const f=R.res.filter(x=>x===false).length,z=R.res.filter(x=>x==="gelb").length;
  const zt=z?`${z} ${z===1?"Zweitversuch":"Zweitversuchen"}`:"";
  if(!f&&!z)return "Fehlerfrei!";
  if(!f)return `Geschafft ohne Fehler mit ${zt}!`;
  return `Geschafft mit ${f} ${f===1?"Fehler":"Fehlern"}${z?" und "+zt:""}!`;}
function ende(){
  if(R.master)return masterEnde();
  const richtig=R.res.filter(x=>x).length, fehler=R.n-richtig, geschafft=fehler<=erlaubt(R.n);
  const vorherOffen=ALLE.filter(offen).length, bossVorher=bossOffen(), masterVorher=masterSichtbar(), alt=summe();
  let neuStern=false,bonus=false,neueMuenze=false;
  if(geschafft&&stars(R.id)<3){S.stars[R.id]=stars(R.id)+1;neuStern=true;save();}
  else if(geschafft){S.bonus[R.id]=(S.bonus[R.id]||0)+1;S.topf++;bonus=true;
    if(S.topf>=BONUS_PRO_MUENZE){S.topf-=BONUS_PRO_MUENZE;S.muenzen++;neueMuenze=true;}save();}
  const neuSpiel=ALLE.filter(offen).length>vorherOffen, neuBoss=!bossVorher&&bossOffen();
  let txt;
  if(geschafft)txt=neuStern?(geschafftText()+" Du bekommst einen Stern."):(neueMuenze?"Bonusstern! Fünf Bonussterne sind voll: Du bekommst einen Credit!":"Bonusstern! Sammle weiter für den nächsten Credit.");
  else txt=`${richtig} von ${R.n} richtig. Mit höchstens ${erlaubt(R.n)===1?"einem Fehler":erlaubt(R.n)+" Fehlern"} bekommst du einen Stern. Versuch es gleich noch einmal!`;
  const neuMaster=!masterVorher&&masterSichtbar();
  const banner=neuMaster?`<div class="banner">💎 Das Master-Level ist freigeschaltet!</div>`:neuBoss?`<div class="banner">⚔ Der Endgegner ist erschienen!</div>`:neuSpiel?`<div class="banner">🔓 Ein neues Spiel ist freigeschaltet!</div>`:"";
  const s=stars(R.id), zeigt=neuStern?s-1:s;
  app.innerHTML=kopf()+`<section class="card ende"><div class="gross" id="gross">${reihe(zeigt,STERN_KARTE)}</div><p class="frage">${txt}</p>${bonus?`<div class="topf" aria-label="Bonussterne bis zum nächsten Credit">${neueMuenze?"":Array.from({length:BONUS_PRO_MUENZE},(_,i)=>`<i class="${i<S.topf?"voll":""}"></i>`).join("")} <svg viewBox="0 0 300 300"><use href="#credit"/></svg></div>`:""}${banner}
    <div class="row"><button class="btn" id="noch">${neuStern&&s<3?"Nächste Runde (schwerer) ▶":"Noch eine Runde ▶"}</button><button class="btn hell" id="heim" style="color:#1b2559;background:#eef0f7;box-shadow:0 5px 0 #b9c0dc">Zur Übersicht</button></div></section>`;
  document.getElementById("abbr").addEventListener("click",home);
  document.getElementById("noch").addEventListener("click",()=>start(R.id));
  document.getElementById("heim").addEventListener("click",home);
  zahlEl.textContent=alt;mzahl.textContent=S.muenzen-(neueMuenze?1:0);
  if(neueMuenze)muenzFlug(()=>{mzahl.textContent=S.muenzen;muenzer.classList.add("puls");setTimeout(()=>muenzer.classList.remove("puls"),450);});
  if(neuStern)sternFlug(()=>{const gr=document.getElementById("gross");if(gr)gr.innerHTML=reihe(s,STERN_KARTE);zahlEl.textContent=summe();
    zaehler.classList.add("puls");setTimeout(()=>zaehler.classList.remove("puls"),450);});
}
function muenzFlug(fertig){
  if(ruhig||!document.body.animate){fertig();return;}
  const box=document.createElement("div");box.className="mflug";box.innerHTML=`<svg viewBox="0 0 300 300"><use href="#credit"/></svg>`;document.body.appendChild(box);
  const coin=box.firstChild;
  for(let i=0;i<22;i++){const g=document.createElement("div");g.className="glitzer";g.style.left="50%";g.style.top="45%";document.body.appendChild(g);
    const w=i/22*Math.PI*2, d=130+Math.random()*110;
    g.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(w)*d}px),calc(-50% + ${Math.sin(w)*d}px)) scale(.2)`,opacity:0}],{duration:1000,delay:300,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>g.remove();}
  box.animate([{transform:"translateY(-60vh) scale(.4)"},{transform:"translateY(0) scale(1.15)",offset:.75},{transform:"translateY(0) scale(1)"}],{duration:700,easing:"cubic-bezier(.3,1.4,.5,1)",fill:"forwards"});
  coin.animate([{transform:"rotateY(0deg)"},{transform:"rotateY(1080deg)"}],{duration:1700,easing:"cubic-bezier(.2,.6,.3,1)",fill:"forwards"}).onfinish=()=>setTimeout(()=>{
    const z=muenzer.getBoundingClientRect(), b=box.getBoundingClientRect();
    const dx=z.left+z.width*0.2-(b.left+b.width/2), dy=z.top+z.height/2-(b.top+b.height/2);
    box.animate([{transform:"translate(0,0) scale(1)"},{transform:`translate(${dx}px,${dy}px) scale(.15)`}],{duration:850,easing:"cubic-bezier(.5,0,.2,1)",fill:"forwards"}).onfinish=()=>{box.remove();fertig();};
  },250);
}
function sternFlug(fertig){
  if(ruhig||!document.body.animate){fertig();return;}
  const st=document.createElementNS("http://www.w3.org/2000/svg","svg");st.setAttribute("class","flug");st.setAttribute("viewBox","0 0 24 24");
  st.innerHTML=`<use href="#st" fill="url(#gold)" stroke="#fff6c8" stroke-width=".6"/>`;document.body.appendChild(st);
  for(let i=0;i<18;i++){const g=document.createElement("div");g.className="glitzer";g.style.left="50%";g.style.top="45%";document.body.appendChild(g);
    const w=i/18*Math.PI*2, d=120+Math.random()*90;
    g.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(w)*d}px),calc(-50% + ${Math.sin(w)*d}px)) scale(.2)`,opacity:0}],{duration:900,delay:250,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>g.remove();}
  const a1=st.animate([{transform:"scale(0) rotate(-180deg)",opacity:0},{transform:"scale(1.35) rotate(20deg)",opacity:1,offset:.6},{transform:"scale(1) rotate(0deg)",opacity:1}],{duration:800,easing:"ease-out",fill:"forwards"});
  a1.onfinish=()=>setTimeout(()=>{
    const z=zaehler.getBoundingClientRect(), s=st.getBoundingClientRect();
    const dx=z.left+z.width*0.18-(s.left+s.width/2), dy=z.top+z.height/2-(s.top+s.height/2);
    st.animate([{transform:"translate(0,0) scale(1) rotate(0deg)"},{transform:`translate(${dx}px,${dy}px) scale(.18) rotate(360deg)`}],{duration:850,easing:"cubic-bezier(.5,0,.2,1)",fill:"forwards"}).onfinish=()=>{st.remove();fertig();};
  },350);
}
home();
})();
